    <rect x="128" y="176" width="18" height="72" rx="9" />
    <rect x="366" y="176" width="18" height="72" rx="9" />
    <rect x="398" y="196" width="18" height="32" rx="9" />
  </g>

  <!-- Arabic letter "ت" for "ترجمة" rendered as a stroke path for crispness -->
  <g fill="#ffffff">
    <path d="M212 356c0-9 7-16 16-16h43c6 0 11 3 14 8l6 10h9c9 0 16-7 16-16s7-16 16-16 16 7 16 16c0 26-21 48-48 48h-11c-14 0-27-7-35-19l-3-5h-23c-9 0-16-7-16-16z" />
    <circle cx="176" cy="388" r="15" />
