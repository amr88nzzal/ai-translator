  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="256" rx="112" fill="url(#glow)" />

  <!-- Globe / language grid -->
  <g stroke="#e0e7ff" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.95">
    <circle cx="256" cy="212" r="104" />
