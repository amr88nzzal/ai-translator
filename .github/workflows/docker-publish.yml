name: build-and-publish

# يبني الصورة لمعماريتي amd64 و arm64 وينشرها على GitHub Container Registry،
# ليقوم سيرفر ARM64 بسحبها وتشغيلها بدون بناء محلي.
on:
  push:
    branches: ['main', 'master']
    tags: ['v*']
  pull_request:
    branches: ['main', 'master']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: فحص الأنواع (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تجهيز Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: تثبيت الاعتماديات
        run: npm ci --ignore-scripts

      - name: فحص الأنواع
        run: npm run typecheck

      - name: بناء الواجهة والخادم
        run: npm run build

      - name: التحقق من المخرجات
        run: |
          test -f dist/server.cjs
          test -f dist/client/index.html
          test -f dist/client/sw.js
          test -f dist/client/manifest.json

  publish:
    name: بناء ونشر صورة Docker (amd64 + arm64)
    needs: verify
    runs-on: ubuntu-latest
    # لا ننشر من طلبات الدمج، فقط من الفروع والوسوم.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تجهيز QEMU (لدعم arm64)
        uses: docker/setup-qemu-action@v3

      - name: تجهيز Buildx
        uses: docker/setup-buildx-action@v3

      - name: تسجيل الدخول إلى GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: استخراج الوسوم والملصقات
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: البناء والنشر
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # المعماريتان معًا: السيرفر ARM64 وجهاز التطوير amd64.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: ملخص النشر
        run: |
          {
            echo '## تم نشر الصورة بنجاح'
            echo ''
            echo 'الوسوم المنشورة:'
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
